credentials_dir: "./credentials"
abnormal_credentials_dir: "./credentials_abnormal"
state_dir: "./state"
log_level: "info"

logging:
  max_file_size: "1MiB"

request_identity:
  originator: "codex_cli_rs"
  user_agent_mode: "generated"
  user_agent_rules:
    versions: |
      0.114.0
      0.115.0
      0.116.0
      0.117.0
      0.118.0
    profiles: |
      windows10
      windows11
      macos
      ubuntu
      debian
    terminals: |
      WindowsTerminal
      Apple_Terminal
      iTerm.app
      vscode
      WezTerm
      Ghostty
      WarpTerminal
      kitty

proxy:
  mode: "fixed"
  list: |
    socks5://127.0.0.1:10808
  backup_list: ""

credential_management:
  abnormal_threshold: 1
  credential_page_size: 50

refresh:
  interval: "6h"
  lead_time: "24h"
  min_sleep: "60s"
  max_sleep: "10m"
  inter_refresh_delay_min: "30s"
  inter_refresh_delay_max: "90s"
  failure_backoff: "15m"

network:
  timeout: "30s"

backup:
  enabled: false
  remotes:
    - name: "primary"
      type: "s3_compatible"
      endpoint: ""
      region: ""
      bucket: ""
      object_prefix: "token-refresh"
      access_key_id: ""
      secret_access_key: ""
      path_style: true
  schedule:
    daily_utc_enabled: true
    after_refresh_enabled: true
    after_refresh_debounce: "5m"
    min_interval_between_auto_backups: "1h"

web:
  enabled: true
  listen: "0.0.0.0:9876"
